<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- Fonts load without blocking first paint: the page shows in system fonts, then swaps. -->
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Share+Tech+Mono&family=LXGW+WenKai+TC:wght@400;700&display=swap"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Share+Tech+Mono&family=LXGW+WenKai+TC:wght@400;700&display=swap"
			media="print"
			onload="this.media = 'all'"
		/>
		<noscript>
			<link
				rel="stylesheet"
				href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Share+Tech+Mono&family=LXGW+WenKai+TC:wght@400;700&display=swap"
			/>
		</noscript>

		<script>
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var theme =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.setAttribute('data-theme', theme);
					// Devices that measured slow before start straight in light-effects mode.
					if (localStorage.getItem('fx-lite') === '1') document.documentElement.dataset.lite = '1';
				} catch (e) {}
				// 開案 intro: plays on every full page load (reloads included; moving
				// between pages inside the site isn't one). Not for crawlers or Lighthouse,
				// never in the admin, and not for anyone who asked for less motion.
				try {
					if (
						!location.pathname.startsWith('/admin') &&
						!/bot|crawl|spider|lighthouse|headless|preview/i.test(navigator.userAgent) &&
						!window.matchMedia('(prefers-reduced-motion: reduce)').matches
					) {
						document.documentElement.dataset.intro = 'on';
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div id="intro" aria-hidden="true">
			<div class="intro-sheet">
				<div class="intro-lamp"></div>
				<div class="intro-stage">
					<div class="intro-evidence">
						<span class="intro-frame"></span>
						<svg class="intro-print" viewBox="0 0 240 300"></svg>
						<span class="intro-scan"></span>
						<span class="intro-ink"></span>
						<svg class="intro-seal" viewBox="0 0 100 100" aria-hidden="true">
							<use href="/favicon.svg#seal" />
						</svg>
					</div>
					<p class="intro-readout"></p>
				</div>
				<span class="intro-skip">CLICK TO SKIP</span>
			</div>
		</div>
		<script>
			(function () {
				var root = document.documentElement;
				var intro = document.getElementById('intro');
				if (root.dataset.intro !== 'on') {
					intro.remove();
					return;
				}

				// A fingerprint, drawn fresh each visit: a whorl at the core, then ridges
				// that loop over the top and run down the sides, wobbling and breaking
				// like real ones.
				var svg = intro.querySelector('.intro-print');
				var seed = Math.random() * 1000;
				function rnd() {
					seed = (seed * 9301 + 49297) % 233280;
					return seed / 233280;
				}
				var cx = 120;
				var cy = 140;
				var ridges = 22;
				var html = '';
				var plain = '';
				for (var i = 0; i < ridges; i++) {
					var base = 6 + i * 5.4;
					var whorl = i < 6;
					var from = whorl ? rnd() * 6.28 : Math.PI * (0.62 + rnd() * 0.08);
					var to = whorl ? from + 6.28 - 0.5 - rnd() * 0.6 : Math.PI * (2.38 - rnd() * 0.08);
					var breakAt = rnd() < 0.55 ? from + (to - from) * (0.2 + rnd() * 0.6) : null;
					var d = '';
					var pen = false;
					for (var t = from; t <= to; t += 0.09) {
						if (breakAt !== null && t > breakAt && t < breakAt + 0.16) {
							pen = false;
							continue;
						}
						var r =
							base *
							(1 +
								0.035 * Math.sin(3 * t + i * 0.9) +
								0.025 * Math.sin(7 * t + i * 1.7) +
								0.02 * Math.sin(2 * t + i * 0.4));
						var s = Math.sin(t);
						var x = cx + Math.cos(t) * r * 0.8;
						// Below the core the finger flattens out.
						var y = cy + s * r * (s > 0 && !whorl ? 0.55 + i * 0.012 : 1);
						d += (pen ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
						pen = true;
					}
					// Developed core first, outward ridge by ridge.
					html +=
						'<path d="' + d + '" style="animation-delay:' + (0.35 + i * 0.035).toFixed(3) + 's"/>';
					plain += '<path d="' + d + '"/>';
				}
				svg.innerHTML = html;
				// An amber copy of the same ridges, shown only where the scanner is.
				svg.insertAdjacentHTML(
					'afterend',
					'<svg class="intro-print-hot" viewBox="0 0 240 300" aria-hidden="true">' +
						plain +
						'</svg>'
				);

				// Fingerprint powder: a puff out from the print's core, drifting up as it
				// settles. Positions come from one layout read, done here before paint.
				var sheet = intro.querySelector('.intro-sheet');
				var box = sheet.getBoundingClientRect();
				var ev = intro.querySelector('.intro-evidence').getBoundingClientRect();
				var coreX = ev.left - box.left + ev.width / 2;
				var coreY = ev.top - box.top + ev.height * (140 / 300);
				for (var k = 0; k < 28; k++) {
					var dot = document.createElement('i');
					var angle = rnd() * Math.PI * 2;
					var dist = 50 + rnd() * 120;
					dot.className = 'intro-dust';
					dot.style.left = coreX + 'px';
					dot.style.top = coreY + 'px';
					dot.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
					dot.style.setProperty('--dy', Math.sin(angle) * dist * 0.8 - 30 + 'px');
					dot.style.animationDelay = 0.28 + rnd() * 0.18 + 's';
					sheet.appendChild(dot);
				}
				// The iris opens from where the seal lands (scale/rotate keep its centre).
				var seal = intro.querySelector('.intro-seal').getBoundingClientRect();
				sheet.style.setProperty('--ix', seal.left - box.left + seal.width / 2 + 'px');
				sheet.style.setProperty('--iy', seal.top - box.top + seal.height / 2 + 'px');

				// The readout: every character is its own span with its own delay, so the
				// typing runs on CSS time and keeps pace while the page is busy loading.
				var out = intro.querySelector('.intro-readout');
				var no = String(Math.floor(rnd() * 9000) + 1000);
				function typed(cls, lines, startAt) {
					var t = startAt;
					var h = '<span class="' + cls + '">';
					lines.forEach(function (line, li) {
						if (li) h += '<br>';
						var strong = false;
						for (var c = 0; c < line.length; c++) {
							var ch = line[c];
							if (ch === '[' || ch === ']') {
								h += ch === '[' ? '<b>' : '</b>';
								strong = ch === '[';
								continue;
							}
							h += '<i style="animation-delay:' + t.toFixed(3) + 's">' + ch + '</i>';
							t += strong ? 0.07 : 0.024;
						}
					});
					return h + '</span>';
				}
				out.innerHTML =
					typed('intro-line1', ['EXHIBIT A · LATENT PRINT № ' + no, '比對指紋中…'], 0.4) +
					typed('intro-line2', ['MATCH FOUND · 99.8%', '身分確認：[LIAM]'], 1.78);

				// The whole timeline runs in CSS; this only tidies up after the iris has
				// opened, or skips straight to opening on a click, key or scroll.
				var done = false;
				function cleanup() {
					if (done) return;
					done = true;
					intro.remove();
					delete root.dataset.intro;
				}
				sheet.addEventListener('animationend', function (e) {
					if (e.animationName === 'intro-iris') cleanup();
				});
				setTimeout(cleanup, 4500);
				function skip() {
					if (root.dataset.intro === 'on') root.dataset.intro = 'out';
				}
				intro.addEventListener('pointerdown', skip);
				addEventListener('keydown', skip, { once: true });
				addEventListener('wheel', skip, { once: true, passive: true });
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
