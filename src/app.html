<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- Fonts load without blocking first paint: the page shows in system fonts, then swaps. -->
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Share+Tech+Mono&family=LXGW+WenKai+TC:wght@400;700&display=swap"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Share+Tech+Mono&family=LXGW+WenKai+TC:wght@400;700&display=swap"
			media="print"
			onload="this.media = 'all'"
		/>
		<noscript>
			<link
				rel="stylesheet"
				href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Share+Tech+Mono&family=LXGW+WenKai+TC:wght@400;700&display=swap"
			/>
		</noscript>

		<script>
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var theme =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.setAttribute('data-theme', theme);
					// Devices that measured slow before start straight in light-effects mode.
					if (localStorage.getItem('fx-lite') === '1') document.documentElement.dataset.lite = '1';
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
