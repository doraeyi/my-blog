<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 320 420" width="320" height="420">
	<title>Q 版 Liam</title>
	<!--
		Chibi Liam, drawn from his photo: thick black hair with a straight, slightly
		separated fringe and a full crown, round face, calm narrow eyes, white shirt
		and black tie under a dark hooded jacket with beige check lining. Holding a
		magnifying glass for the detective theme. Transparent background so the
		particle portrait keys it out cleanly.
	-->
	<defs>
		<radialGradient id="skin" cx="0.45" cy="0.42" r="0.65">
			<stop offset="0" stop-color="#fbe0c8" />
			<stop offset="1" stop-color="#efc6a6" />
		</radialGradient>
		<linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2a2420" />
			<stop offset="1" stop-color="#141110" />
		</linearGradient>
		<linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#34343d" />
			<stop offset="1" stop-color="#1d1d23" />
		</linearGradient>
		<pattern id="check" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)">
			<rect width="14" height="14" fill="#dcc7a2" />
			<path d="M0 3h14M0 10h14" stroke="#8a6d45" stroke-width="1.2" opacity="0.7" />
			<path d="M4 0v14M11 0v14" stroke="#2c2118" stroke-width="1.4" opacity="0.55" />
			<path d="M7 0v14" stroke="#b3362b" stroke-width="0.8" opacity="0.6" />
		</pattern>
	</defs>

	<!-- ── Body ── -->
	<path d="M98 460 C98 384 126 340 170 326 L230 326 C274 340 302 384 302 460 Z" fill="url(#jacket)" />
	<!-- Shirt and collar -->
	<path d="M174 328 L200 398 L226 328 Z" fill="#fbfaf6" />
	<path d="M174 328 L164 356 L198 344 Z" fill="#f1efe8" />
	<path d="M226 328 L236 356 L202 344 Z" fill="#f1efe8" />
	<!-- Tie -->
	<path d="M192 338 L208 338 L210 352 L190 352 Z" fill="#141418" />
	<path d="M190 350 L210 350 L215 428 L200 444 L185 428 Z" fill="#141418" />
	<path d="M197 356 L202 356 L206 424 L200 432 Z" fill="#2c2c34" />
	<!-- Check lining on the right lapel -->
	<path d="M226 328 L254 348 L236 460 L216 432 Z" fill="url(#check)" />
	<path d="M226 328 L254 348 L236 460" fill="none" stroke="#141418" stroke-width="2" opacity="0.5" />
	<!-- Left lapel edge -->
	<path d="M174 328 L146 348 L164 460" fill="none" stroke="#45454f" stroke-width="3" />
	<!-- Hood rolled behind the neck -->
	<path d="M146 334 C150 306 250 306 254 334 C236 322 164 322 146 334 Z" fill="#3e3e48" />

	<!-- ── Arm + magnifying glass (his left, viewer's right) ── -->
	<path d="M282 372 C300 392 304 414 296 432 L276 428 C280 414 276 398 266 386 Z" fill="#2a2a32" />
	<line x1="288" y1="420" x2="306" y2="394" stroke="#6b4f2a" stroke-width="9" stroke-linecap="round" />
	<circle cx="288" cy="428" r="15" fill="url(#skin)" />
	<path d="M280 422 Q288 416 296 424" stroke="#d9a07c" stroke-width="2.5" fill="none" stroke-linecap="round" />
	<circle cx="318" cy="368" r="25" fill="rgba(210,232,255,0.35)" stroke="#b8904f" stroke-width="7" />
	<path d="M305 357 Q311 349 320 347" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85" />

	<!-- ── Head ── -->
	<!-- Ears -->
	<ellipse cx="100" cy="238" rx="14" ry="19" fill="#efc6a6" />
	<ellipse cx="300" cy="238" rx="14" ry="19" fill="#ecc2a1" />
	<path d="M96 232 Q102 240 98 248" stroke="#d9a07c" stroke-width="2.5" fill="none" stroke-linecap="round" />
	<path d="M304 232 Q298 240 302 248" stroke="#d9a07c" stroke-width="2.5" fill="none" stroke-linecap="round" />
	<!-- Face -->
	<ellipse cx="200" cy="214" rx="101" ry="98" fill="url(#skin)" />
	<!-- Neck shadow -->
	<path d="M178 306 Q200 318 222 306 L222 328 L178 328 Z" fill="#e2b493" />

	<!-- Hair: full crown, sides over the temples, a straight fringe in clumps -->
	<path
		d="M96 232
		   C84 150 116 66 200 58
		   C284 66 316 150 304 232
		   L294 214
		   L290 186
		   Q276 198 262 184
		   Q248 200 233 185
		   Q218 200 203 185
		   Q188 200 173 185
		   Q158 199 144 185
		   Q130 197 118 186
		   L108 214 Z"
		fill="url(#hair)"
	/>
	<!-- Fringe clump separations -->
	<path d="M174 150 Q170 168 173 184 M204 146 Q202 166 203 184 M234 150 Q236 168 233 184 M146 158 Q142 172 144 184 M262 158 Q266 172 262 184" stroke="#3b332e" stroke-width="2.5" fill="none" stroke-linecap="round" />
	<!-- Crown tuft and shine -->
	<path d="M192 62 Q198 46 212 52 Q204 56 206 64 Z" fill="#141110" />
	<path d="M136 112 Q164 80 206 76" stroke="#5a4f48" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.55" />

	<!-- Eyes: calm and narrow, like his -->
	<path d="M146 236 Q162 228 178 236" stroke="#1f1814" stroke-width="4.5" stroke-linecap="round" fill="none" />
	<path d="M222 236 Q238 228 254 236" stroke="#1f1814" stroke-width="4.5" stroke-linecap="round" fill="none" />
	<ellipse cx="162" cy="241" rx="10" ry="8" fill="#1f1814" />
	<ellipse cx="238" cy="241" rx="10" ry="8" fill="#1f1814" />
	<circle cx="165.5" cy="238" r="2.8" fill="#fff" />
	<circle cx="241.5" cy="238" r="2.8" fill="#fff" />
	<!-- Brows peeking under the fringe -->
	<path d="M150 214 Q162 210 176 213" stroke="#2a2420" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
	<path d="M224 213 Q238 210 250 214" stroke="#2a2420" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
	<!-- Nose -->
	<path d="M200 256 Q206 266 198 270" stroke="#d9a07c" stroke-width="3.5" stroke-linecap="round" fill="none" />
	<!-- Cheeks -->
	<ellipse cx="140" cy="268" rx="15" ry="9" fill="#f29a8a" opacity="0.35" />
	<ellipse cx="260" cy="268" rx="15" ry="9" fill="#f29a8a" opacity="0.35" />
	<!-- Mouth: small and even, the faintest smile -->
	<path d="M186 286 Q200 293 214 285" stroke="#9c5444" stroke-width="4" stroke-linecap="round" fill="none" />
</svg>
