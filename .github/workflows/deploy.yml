name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/my-blog

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    # Runs directly on the VM via a self-hosted runner — the VM polls GitHub for
    # jobs over an outbound connection, so nothing needs to accept inbound SSH.
    # Register it once: repo Settings → Actions → Runners → New self-hosted runner.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.yml
          sparse-checkout-cone-mode: false

      # .env and data/ in ~/my-blog are untouched — they're not tracked in this
      # repo, only docker-compose.yml gets synced. Lives under the runner
      # user's home dir (not /srv) so no sudo/root is needed to write here.
      - name: Sync compose file and redeploy
        run: |
          set -euo pipefail
          mkdir -p "$HOME/my-blog"
          cp docker-compose.yml "$HOME/my-blog/docker-compose.yml"
          cd "$HOME/my-blog"
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
