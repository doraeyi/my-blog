services:
  app:
    build: .
    image: ghcr.io/doraeyi/my-blog:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=/data/local.db
    volumes:
      - ./data:/data
    # Bound to localhost only — reached by the VM's existing host-level
    # cloudflared process (same tunnel already serving gitstats/streak/activity),
    # not exposed to the network. No separate cloudflared container here.
    ports:
      - '127.0.0.1:3000:3000'
