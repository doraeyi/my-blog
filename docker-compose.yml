services:
  app:
    build: .
    image: ghcr.io/doraeyi/my-blog:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=/data/local.db
    volumes:
      - ./data:/data
    # Still published for local/debugging access on the VM itself — actual
    # public traffic reaches this container through Traefik (see labels
    # below), which routes by Host header over the `web` network, not
    # through this port.
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - default
      - web
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.my-blog.rule=Host(`doraeyi.com`)'
      - 'traefik.http.routers.my-blog.entrypoints=web'
      - 'traefik.http.services.my-blog.loadbalancer.server.port=3000'
      # This container is on two networks (default + web) — without this,
      # Traefik can pick either one when resolving the container's IP, and
      # picking `default` (which Traefik itself isn't attached to) means
      # every request times out instead of connecting.
      - 'traefik.docker.network=web'

networks:
  # Pre-existing network the VM's standalone Traefik container is attached
  # to — created outside this compose project, so it's referenced, not owned.
  web:
    external: true
